name: Test and deploy research portal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[train,dev,web]'
      - run: pytest -q
      - run: bhaashik audit --train data/examples/train.jsonl --dev data/examples/dev.jsonl --test data/examples/test.jsonl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/app.js
      - run: playwright install --with-deps chromium
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: build/browser
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Markdown==3.7
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
